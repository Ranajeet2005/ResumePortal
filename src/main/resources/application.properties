# =========================================================
# APPLICATION
# =========================================================

spring.application.name=resume-portal
server.port=8080


# =========================================================
# POSTGRESQL DATABASE
# =========================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/resume_portal
spring.datasource.username=postgres
spring.datasource.password=Ranajeet23
spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# =========================================================
# AWS
# =========================================================

aws.region=ap-south-1
aws.s3.bucket=YOUR_S3_BUCKET_NAME


# =========================================================
# JWT
# =========================================================

jwt.secret=ResumePortalJwtSecretKey2026SecureRandomKey
jwt.expiration=86400000


# =========================================================
# FILE UPLOAD
# =========================================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB


# =========================================================
# ERROR HANDLING
# =========================================================

server.error.include-message=always
server.error.include-binding-errors=always


# =========================================================
# LOGGING
# =========================================================

logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE